<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer42NFT - Mint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Summer42NFT</h1>
        <p>Mint an NFT on BNB Smart Chain Testnet.</p>

        <button id="connect-wallet" type="button">
            Connect MetaMask
        </button>

        <p id="wallet-address">No account connected.</p>

        <p>
            <label for="contract-address">Contract address</label>
            <input id="contract-address" type="text" placeholder="0x..." autocomplete="off">
        </p>
        <button id="load-contract" type="button" disabled>Load contract</button>
        <p id="loaded-contract">No contract loaded.</p>

        <button id="mint-nft" type="button" disabled>
            Mint NFT
        </button>

        <p id="status" role="status"></p>
    </main>
    
    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

        const connectButton = document.getElementById("connect-wallet");
        const walletAddress = document.getElementById("wallet-address");
        const statusMessage = document.getElementById("status");
        const mintButton = document.getElementById("mint-nft");
        const addressInput = document.getElementById("contract-address");
        const loadButton = document.getElementById("load-contract");
        const loadedContract = document.getElementById("loaded-contract");

        let contractAddress = null;
        const contractABI = [
            "function mint()",
            "function creator() view returns (address)",
            "function totalMinted() view returns (uint256)",
            "event Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
        ];
    
        async function connectWallet() {
            try {
                const accounts = await window.ethereum.request({
                    method: "eth_requestAccounts"
                });
    
                walletAddress.textContent = accounts[0];
                loadButton.disabled = false;
                mintButton.disabled = contractAddress === null;
                statusMessage.textContent = "Wallet connected.";
            } catch {
                statusMessage.textContent = "Unable to connect. Please check MetaMask.";
            }
        }

        // Vérifier le réseau avant de lire ou modifier le contrat.
        async function getTestnetProvider() {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const network = await provider.getNetwork();
            if (network.chainId !== 97n) {
                throw new Error("Please select BSC Testnet in MetaMask.");
            }
            return provider;
        }

        async function loadContract() {
            contractAddress = null;
            mintButton.disabled = true;
            loadButton.disabled = true;
            loadedContract.textContent = "No contract loaded.";

            try {
                const address = addressInput.value.trim();
                if (!ethers.isAddress(address)) {
                    throw new Error("Please enter a valid contract address.");
                }
                const provider = await getTestnetProvider();
                if (await provider.getCode(address) === "0x") {
                    throw new Error("No contract found at this address on BSC Testnet.");
                }
                // Ces lectures vérifient les fonctions attendues de nos contrats.
                const contract = new ethers.Contract(address, contractABI, provider);
                await contract.creator();
                const total = await contract.totalMinted();

                contractAddress = ethers.getAddress(address);
                loadedContract.textContent = `Loaded: ${contractAddress} — ${total} minted`;
                mintButton.disabled = false;
                statusMessage.textContent = "Contract loaded. Ready to mint.";
            } catch (error) {
                statusMessage.textContent = error.shortMessage || error.message;
            } finally {
                loadButton.disabled = false;
            }
        }

        async function mintNFT() {
            mintButton.disabled = true;
            loadButton.disabled = true;
            connectButton.disabled = true;
            const mintAddress = contractAddress;

            try {
                if (!mintAddress) {
                    throw new Error("Please load a contract first.");
                }
                const provider = await getTestnetProvider();
                const signer = await provider.getSigner();
                walletAddress.textContent = await signer.getAddress();
                const contract = new ethers.Contract(mintAddress, contractABI, signer);

                statusMessage.textContent = "Please confirm in MetaMask.";
                const transaction = await contract.mint();

                statusMessage.textContent = "Waiting for confirmation on the blockchain...";
                const receipt = await transaction.wait();
                const mintEvent = receipt.logs.find(log =>
                    log.address.toLowerCase() === mintAddress.toLowerCase() &&
                    log.eventName === "Transfer" && log.args.from === ethers.ZeroAddress
                );

                statusMessage.textContent = mintEvent
                    ? `NFT #${mintEvent.args.tokenId} minted successfully!`
                    : `Transaction confirmed. Check the NFT in Remix. Hash: ${receipt.hash}`;
            } catch (error) {
                if (error.reason === "Only creator can mint") {
                    statusMessage.textContent = "Wrong account. Only the deployer can mint.";
                } else {
                    statusMessage.textContent = error.shortMessage || error.message || "Mint failed or cancelled.";
                }
            } finally {
                mintButton.disabled = contractAddress === null;
                loadButton.disabled = false;
                connectButton.disabled = false;
            }
        }
    
        connectButton.addEventListener("click", connectWallet);
        loadButton.addEventListener("click", loadContract);
        mintButton.addEventListener("click", mintNFT);

    </script>
</body>
</html>
